<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Pata Mwenza Sahihi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff0f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #d81b60; margin-bottom: 5px; }
        p.subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        .avatars { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .avatars img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #d81b60; }
        label { display: block; text-align: left; font-weight: bold; margin-top: 15px; margin-bottom: 5px; color: #333; font-size: 14px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; transition: border 0.3s; }
        input[type="text"]:focus, input[type="file"]:focus { border-color: #d81b60; }
        button { background-color: #d81b60; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: background 0.3s; }
        button:hover { background-color: #ad1457; }
        .footer-link { margin-top: 15px; font-size: 13px; display: block; color: #666; }
        .footer-link a { color: #d81b60; text-decoration: none; font-weight: bold; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>TanzaniaSoulMate ❤️</h2>
    <p class="subtitle">Mtandao wa kipekee wa kisasa wa kupata mwenza sahihi</p>
    
    <div class="avatars">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="User">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" alt="User">
        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" alt="User">
    </div>

    <form id="signupForm">
        <label for="fullName">Jina Lako Kamili:</label>
        <input type="text" id="fullName" placeholder="Mfano: Juma Ally au Asha" required>

        <label for="whatsappNumber">Namba ya WhatsApp:</label>
        <input type="text" id="whatsappNumber" placeholder="Mfano: 0712345678" required>

        <label for="photoFile">Pakia Picha Yako Halisi:</label>
        <input type="file" id="photoFile" accept="image/*" required>

        <button type="submit">Jiandikishe Sasa</button>
    </form>

    <span class="footer-link">
        Una picha tayari? <a href="discover.html">Nenda kachati hapa 🚀</a>
    </span>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value;
        const whatsappNumber = document.getElementById('whatsappNumber').value;
        const photoFile = document.getElementById('photoFile').files[0];

        if (!photoFile) {
            alert('Tafadhali chagua picha yako!');
            return;
        }

        const formData = new FormData();
        formData.append('fullName', fullName);
        formData.append('whatsappNumber', whatsappNumber);
        formData.append('photoFile', photoFile);

        try {
            const res = await fetch('/api/signup', {
                method: 'POST',
                body: formData
            });
            
            const data = await res.json();
            if (res.ok) {
                alert("Umefanikiwa kujisajili na picha yako imeingia hewani moja kwa moja!");
                window.location.href = 'discover.html';
            } else {
                alert(data.error || 'Kulikuwa na hitilafu fulani.');
            }
        } catch (err) {
            console.error(err);
            alert('Imeshindwa kuunganisha na seva.');
        }
    });
</script>

</body>
</html>
