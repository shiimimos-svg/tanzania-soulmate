<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Ingia au Jisajili</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin: 20px;
        }
        h2 {
            color: #d63384;
            text-align: center;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #777;
        }
        .tab.active {
            color: #d63384;
            border-bottom: 2px solid #d63384;
            margin-bottom: -2px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #444;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background: #d63384;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background: #c02974;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>TanzaniaSoulMate ❤️</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Ingia (Login)</div>
            <div class="tab" onclick="switchTab('signup')">Jisajili (Sign Up)</div>
        </div>

        <!-- LOGIN FORM -->
        <div id="loginSection" class="form-section active">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Namba ya WhatsApp</label>
                    <input type="text" id="loginPhone" placeholder="Mfano: 0712345678" required>
                </div>
                <button type="submit">Ingia Kwenye Akaunti</button>
            </form>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signupSection" class="form-section">
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Jina Lako Kamili</label>
                    <input type="text" id="signupName" placeholder="Andika jina lako" required>
                </div>
                <div class="form-group">
                    <label>Namba ya WhatsApp</label>
                    <input type="text" id="signupPhone" placeholder="Mfano: 0712345678" required>
                </div>
                <div class="form-group">
                    <label>Unatafuta Nini?</label>
                    <select id="signupSeeking" required>
                        <option value="Mchumba wa Ndoa">Mchumba wa Ndoa</option>
                        <option value="Urafiki Tu">Urafiki Tu</option>
                        <option value="Mahusiano ya Kawaida">Mahusiano ya Kawaida</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Chagua Picha Yako (Upload Photo)</label>
                    <input type="file" id="signupPhotoFile" accept="image/*" required>
                </div>
                <button type="submit">Jisajili Sasa</button>
            </form>
        </div>

        <div id="message" class="msg"></div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));

            if (tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('signupSection').classList.add('active');
            }
            document.getElementById('message').innerText = '';
        }

        async function handleSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('signupName').value;
            const whatsappNumber = document.getElementById('signupPhone').value;
            const seeking = document.getElementById('signupSeeking').value;
            const photoFile = document.getElementById('signupPhotoFile').files[0];
            const msgDiv = document.getElementById('message');

            if (!photoFile) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Tafadhali chagua picha yako kwanza!";
                return;
            }

            msgDiv.style.color = 'blue';
            msgDiv.innerText = "Inapakia picha yako, tafadhali subiri...";

            const reader = new FileReader();
            reader.readAsDataURL(photoFile);
            reader.onload = async function () {
                const photoData = reader.result;

                try {
                    const res = await fetch('/api/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullName, whatsappNumber, photoData, seeking })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        msgDiv.style.color = 'green';
                        msgDiv.innerText = data.message;
                        setTimeout(() => switchTab('login'), 3000);
                    } else {
                        msgDiv.style.color = 'red';
                        msgDiv.innerText = data.error;
                    }
                } catch (err) {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = "Hitilafu ya mtandao wakati wa kujisajili. Jaribu tena.";
                }
            };
        }

        async function handleLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const msgDiv = document.getElementById('message');

            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                
                const user = users.find(u => u.whatsappNumber === phone);

                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = "Umeingia kwa mafanikio! Unapelekwa kwenye ukurasa mkuu...";
                    setTimeout(() => {
                        window.location.href = 'discover.html';
                    }, 1500);
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = "Namba hii haijapatikana. Tafadhali jisajili kwanza.";
                }
            } catch (err) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Hitilafu imetokea wakati wa kuingia.";
            }
        }
    </script>
</body>
</html>
