<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Find Your Heart in Tanzania</title>
    <style>
        :root {
            --primary: #d63384;
            --primary-hover: #c02974;
            --text-dark: #111827;
            --text-muted: #4b5563;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            background-color: #ffffff;
        }

        /* Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #ffffff;
            border-bottom: 1px solid #f3f4f6;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: bold;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 15px;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .auth-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-login {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            padding: 8px 16px;
            font-size: 15px;
        }

        .btn-signup {
            text-decoration: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-signup:hover {
            background: var(--primary-hover);
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: calc(100vh - 81px);
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            display: flex;
            align-items: center;
            padding: 0 80px;
        }

        .hero-content {
            max-width: 650px;
            color: white;
        }

        .hero-badge {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ff85a1;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 56px;
            line-height: 1.1;
            margin: 0 0 20px 0;
            font-weight: 800;
        }

        .hero h1 span {
            color: #ff4d6d;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.5;
            color: #f3f4f6;
            margin-bottom: 30px;
        }

        .hero-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--primary);
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: background 0.2s, transform 0.1s;
            border: none;
            cursor: pointer;
        }

        .hero-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Modal Overlay for Login / Signup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            box-sizing: border-box;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #9ca3af;
            background: none;
            border: none;
        }

        .modal-card h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 24px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #f3f4f6;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
        }

        .tab.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            margin-bottom: -2px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-dark);
            font-size: 14px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Mtindo wa namba ya simu yenye +255 ya kudumu */
        .phone-input-container {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .phone-input-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(214, 51, 132, 0.1);
        }

        .country-code {
            background-color: #f8f9fa;
            color: #333;
            padding: 12px 10px;
            font-size: 15px;
            font-weight: bold;
            border-right: 1px solid #d1d5db;
            user-select: none;
        }

        .phone-input-container input {
            border: none;
            outline: none;
            padding: 12px;
            font-size: 15px;
            width: 100%;
        }

        .modal-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            margin-top: 10px;
        }

        .modal-submit:hover {
            background: var(--primary-hover);
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .msg {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .nav-links { display: none; }
            .hero { padding: 0 20px; }
            .hero h1 { font-size: 38px; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <header>
        <a href="#" class="logo">❤️ Tanzania<span>SoulMate</span></a>
        <ul class="nav-links">
            <li><a href="#" onclick="openModal('login')">Discover</a></li>
            <li><a href="#" onclick="openModal('login')">Messages</a></li>
            <li><a href="#" onclick="openModal('login')">Pricing</a></li>
        </ul>
        <div class="auth-buttons">
            <a href="#" class="btn-login" onclick="openModal('login')">Login</a>
            <a href="#" class="btn-signup" onclick="openModal('signup')">Sign Up</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-badge">MADE EXCLUSIVELY FOR TANZANIA</div>
            <h1>Find Your Heart in Tanzania ❤️</h1>
            <p>Meet genuine people. Connect. Chat. Build something real.</p>
            <button class="hero-btn" onclick="openModal('signup')">Jiunge na TanzaniaSoulMate &rarr;</button>
        </div>
    </section>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-card">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <h2>TanzaniaSoulMate ❤️</h2>
            
            <div class="tabs">
                <div id="loginTabBtn" class="tab active" onclick="switchTab('login')">Ingia (Login)</div>
                <div id="signupTabBtn" class="tab" onclick="switchTab('signup')">Jisajili (Sign Up)</div>
            </div>

            <!-- LOGIN FORM -->
            <div id="loginSection" class="form-section active">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Namba ya WhatsApp / Simu (Tanzania)</label>
                        <div class="phone-input-container">
                            <span class="country-code">+255</span>
                            <input type="text" id="loginPhone" placeholder="712345678 (Anza na 0 au 7)" maxlength="10" required>
                        </div>
                    </div>
                    <button type="submit" class="modal-submit">Ingia Kwenye Akaunti</button>
                </form>
            </div>

            <!-- SIGNUP FORM -->
            <div id="signupSection" class="form-section">
                <form id="signupForm" onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label>Jina Lako Kamili</label>
                        <input type="text" id="signupName" placeholder="Andika jina lako" required>
                    </div>
                    <div class="form-group">
                        <label>Namba ya WhatsApp / Simu (Tanzania)</label>
                        <div class="phone-input-container">
                            <span class="country-code">+255</span>
                            <input type="text" id="signupPhone" placeholder="712345678 (Anza na 0 au 7)" maxlength="10" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Unatafuta Nini?</label>
                        <select id="signupSeeking" required>
                            <option value="Mchumba wa Ndoa">Mchumba wa Ndoa</option>
                            <option value="Urafiki Tu">Urafiki Tu</option>
                            <option value="Mahusiano ya Kawaida">Mahusiano ya Kawaida</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Chagua Picha Yako (Upload Photo)</label>
                        <input type="file" id="signupPhotoFile" accept="image/*" required>
                    </div>
                    <button type="submit" class="modal-submit">Jisajili Sasa</button>
                </form>
            </div>

            <div id="message" class="msg"></div>
        </div>
    </div>

    <script>
        function openModal(tabName) {
            document.getElementById('authModal').style.display = 'flex';
            switchTab(tabName);
        }

        function closeModal() {
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('message').innerText = '';
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));

            if (tabName === 'login') {
                document.getElementById('loginTabBtn').classList.add('active');
                document.getElementById('loginSection').classList.add('active');
            } else {
                document.getElementById('signupTabBtn').classList.add('active');
                document.getElementById('signupSection').classList.add('active');
            }
            document.getElementById('message').innerText = '';
        }

        // Kazi iliyoboreshwa ya kusafisha na kuunganisha namba ya Tanzania
        function formatTzPhone(inputVal) {
            let clean = inputVal.trim();
            
            // Ondoa mwanzo wowote wa +255 au 255 kama ipo
            if (clean.startsWith('+255')) {
                clean = clean.substring(4);
            } else if (clean.startsWith('255')) {
                clean = clean.substring(3);
            }
            
            // Ondoa sifuri ya kwanza ili kuzuia kurudia sifuri
            if (clean.startsWith('0')) {
                clean = clean.substring(1);
            }
            
            return '+255' + clean;
        }

        async function handleSignup(e) {
            e.preventDefault();
            const fullName = document.getElementById('signupName').value;
            const rawPhone = document.getElementById('signupPhone').value;
            const seeking = document.getElementById('signupSeeking').value;
            const photoFile = document.getElementById('signupPhotoFile').files[0];
            const msgDiv = document.getElementById('message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            if (!photoFile) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Tafadhali chagua picha yako kwanza!";
                return;
            }

            const whatsappNumber = formatTzPhone(rawPhone);
            const tzPhoneRegex = /^\+255[67]\d{8}$/;
            if (!tzPhoneRegex.test(whatsappNumber)) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Namba ya simu si sahihi! Tafadhali ingiza namba halali ya Tanzania (mfano: 07xxxxxxxx).";
                return;
            }

            // Weka Loading State
            submitBtn.disabled = true;
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "Inajisajili...";

            msgDiv.style.color = 'blue';
            msgDiv.innerText = "Inapakia picha yako, tafadhali subiri...";

            const reader = new FileReader();
            reader.readAsDataURL(photoFile);
            reader.onload = async function () {
                const photoData = reader.result;

                try {
                    const res = await fetch('/api/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullName, whatsappNumber, photoData, seeking })
                    });
                    const data = await res.json();

                    if (res.ok) {
                        msgDiv.style.color = 'green';
                        msgDiv.innerText = data.message;
                        setTimeout(() => switchTab('login'), 2500);
                    } else {
                        msgDiv.style.color = 'red';
                        msgDiv.innerText = data.error;
                        submitBtn.disabled = false;
                        submitBtn.innerText = originalText;
                    }
                } catch (err) {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = "Hitilafu ya mtandao wakati wa kujisajili. Jaribu tena.";
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalText;
                }
            };
        }

        async function handleLogin(e) {
            e.preventDefault();
            const rawPhone = document.getElementById('loginPhone').value;
            const msgDiv = document.getElementById('message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            const whatsappNumber = formatTzPhone(rawPhone);
            const tzPhoneRegex = /^\+255[67]\d{8}$/;
            if (!tzPhoneRegex.test(whatsappNumber)) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Namba ya simu si sahihi! Tafadhali ingiza namba halali ya Tanzania (mfano: 07xxxxxxxx).";
                return;
            }

            // Weka Loading State kwenye Login
            submitBtn.disabled = true;
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "Inaingia...";
            msgDiv.style.color = 'blue';
            msgDiv.innerText = "Inahakiki taarifa zako, tafadhali subiri...";

            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                
                const user = users.find(u => u.whatsappNumber === whatsappNumber);

                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    msgDiv.style.color = 'green';
                    msgDiv.innerText = "Umeingia kwa mafanikio! Unapelekwa...";
                    setTimeout(() => {
                        window.location.href = 'discover.html';
                    }, 1200);
                } else {
                    msgDiv.style.color = 'red';
                    msgDiv.innerText = "Namba hii haijapatikana. Tafadhali jisajili kwanza.";
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalText;
                }
            } catch (err) {
                msgDiv.style.color = 'red';
                msgDiv.innerText = "Hitilafu imetokea wakati wa kuingia.";
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        }

        window.onclick = function(event) {
            const modal = document.getElementById('authModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
