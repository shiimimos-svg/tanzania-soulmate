<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanzania Soul Mate - Pata Mchumba au Rafiki wa Kweli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f4; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        @media(min-width: 481px) { .container { min-height: 85vh; border-radius: 20px; overflow: hidden; } }

        .page-section { display: none; flex: 1; flex-direction: column; padding: 30px; animation: fadeIn 0.4s ease-in-out; }
        .page-section.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .landing-hero { text-align: center; margin: auto 0; }
        .landing-hero i { font-size: 70px; color: #ff3366; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .landing-hero h1 { font-size: 26px; color: #111; margin-bottom: 10px; font-weight: 700; }
        .landing-hero p { color: #666; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; text-align: center; display: block; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #ff3366, #ff6b8b); color: white; box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3); margin-bottom: 15px; }
        .btn-outline { background: transparent; border: 2px solid #ff3366; color: #ff3366; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; outline: none; }
        
        .back-link { display: inline-flex; align-items: center; gap: 8px; color: #666; font-size: 14px; text-decoration: none; margin-bottom: 20px; font-weight: 500; cursor: pointer; }

        .photo-upload-box { border: 2px dashed #ddd; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; position: relative; background: #fafafa; }
        .photo-upload-box input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .photo-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; display: none; border: 2px solid #ff3366; }

        .alert-msg { padding: 10px 15px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; }
        .alert-error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="landingPage" class="page-section active">
        <div class="landing-hero">
            <i class="fa-solid fa-heart"></i>
            <h1>Tanzania Soul Mate</h1>
            <p>Ungana na mchumba au rafiki wa dhati Tanzania nzima kwa njia salama na rahisi.</p>
            <button class="btn btn-primary" onclick="showPage('signupPage')">Anza Sasa (Jisajili)</button>
            <button class="btn btn-outline" onclick="showPage('loginPage')">Ninayo Akaunti (Ingia)</button>
        </div>
    </div>

    <div id="signupPage" class="page-section">
        <a class="back-link" onclick="showPage('landingPage')"><i class="fa-solid fa-arrow-left"></i> Rudi Nyuma</a>
        <h2>Fungua Akaunti</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Jaza taarifa zako za Tanzania Soul Mate.</p>
        
        <div id="signupAlert" class="alert-msg"></div>

        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label>Jina Lako Kamili</label>
                <input type="text" id="signupName" class="form-control" placeholder="Mf. Juma Ally" required>
            </div>
            
            <div class="form-group">
                <label>Namba ya WhatsApp</label>
                <input type="text" id="signupPhone" class="form-control" placeholder="Mf. 0712345678" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Umri</label>
                    <input type="number" id="signupAge" class="form-control" value="24" min="18" max="70" required>
                </div>
                <div class="form-group">
                    <label>Mkoa</label>
                    <input type="text" id="signupRegion" class="form-control" value="Dar es Salaam" required>
                </div>
            </div>

            <div class="form-group">
                <label>Unatafuta Nini?</label>
                <select id="signupSeeking" class="form-control">
                    <option value="Mchumba wa Ndoa">Mchumba wa Ndoa</option>
                    <option value="Urafiki wa Kawaida">Urafiki wa Kawaida</option>
                    <option value="Mahusiano ya Kina">Mahusiano ya Kina</option>
                </select>
            </div>

            <div class="form-group">
                <label>Weka Picha Yako</label>
                <div class="photo-upload-box">
                    <img id="signupPhotoPreview" class="photo-preview" src="" alt="Preview">
                    <div id="uploadPromptText"><i class="fa-solid fa-camera" style="font-size: 24px; color: #ff3366; margin-bottom: 5px;"></i><br>Bonyeza kupakia picha</div>
                    <input type="file" id="signupPhotoFile" accept="image/*" onchange="previewImage(event)">
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Malizia Usajili</button>
        </form>
    </div>

    <div id="loginPage" class="page-section">
        <a class="back-link" onclick="showPage('landingPage')"><i class="fa-solid fa-arrow-left"></i> Rudi Nyuma</a>
        <h2>Karibu Tena</h2>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Ingiza namba yako ya WhatsApp.</p>

        <div id="loginAlert" class="alert-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Namba ya WhatsApp</label>
                <input type="text" id="loginPhone" class="form-control" placeholder="Mf. 0712345678" required>
            </div>
            <button type="submit" class="btn btn-primary">Ingia Kwenye Mfumo</button>
        </form>
    </div>

</div>

<script>
    let base64PhotoString = "";

    function showPage(pageId) {
        document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64PhotoString = e.target.result;
                const preview = document.getElementById('signupPhotoPreview');
                preview.src = base64PhotoString;
                preview.style.display = 'block';
                document.getElementById('uploadPromptText').style.display = 'none';
            }
            reader.readAsDataURL(file);
        }
    }

    async function handleSignup(e) {
        e.preventDefault();
        const alertBox = document.getElementById('signupAlert');
        
        const payload = {
            fullName: document.getElementById('signupName').value,
            whatsappNumber: document.getElementById('signupPhone').value,
            age: parseInt(document.getElementById('signupAge').value),
            region: document.getElementById('signupRegion').value,
            seeking: document.getElementById('signupSeeking').value,
            photoData: base64PhotoString
        };

        try {
            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if (response.ok) {
                localStorage.setItem('soulmateUser', JSON.stringify(data.user));
                window.location.href = 'discover.html';
            } else {
                alertBox.className = "alert-msg alert-error";
                alertBox.innerText = data.error || "Hitilafu imetokea.";
                alertBox.style.display = "block";
            }
        } catch (err) {
            alertBox.className = "alert-msg alert-error";
            alertBox.innerText = "Imeshindikana kuunganisha na seva.";
            alertBox.style.display = "block";
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const alertBox = document.getElementById('loginAlert');
        const phone = document.getElementById('loginPhone').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ whatsappNumber: phone })
            });
            const data = await response.json();

            if (response.ok && data.success) {
                localStorage.setItem('soulmateUser', JSON.stringify(data.user));
                window.location.href = 'discover.html';
            } else {
                alertBox.className = "alert-msg alert-error";
                alertBox.innerText = data.error || "Namba haijapatikana.";
                alertBox.style.display = "block";
            }
        } catch (err) {
            alertBox.className = "alert-msg alert-error";
            alertBox.innerText = "Hitilafu ya mtandao.";
            alertBox.style.display = "block";
        }
    }
</script>

</body>
</html>
