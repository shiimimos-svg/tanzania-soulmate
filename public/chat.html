<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazungumzo - TanzaniaSoulMate</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }
        .chat-header {
            background: #d63384;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h3 {
            margin: 0;
        }
        .back-btn {
            background: white;
            color: #d63384;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #fafafa;
        }
        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            word-break: break-word;
        }
        .message.sent {
            background: #d63384;
            color: white;
            align-self: flex-end;
        }
        .message.received {
            background: #e5e5ea;
            color: #333;
            align-self: flex-start;
        }
        .chat-input-area {
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        .chat-input-area button {
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .locked-overlay {
            background: #fff0f3;
            color: #d63384;
            padding: 20px;
            text-align: center;
            border-top: 1px solid #ffccd5;
            font-weight: bold;
        }
        .locked-overlay button {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <button class="back-btn" onclick="window.location.href='discover.html'">Rudi</button>
            <h3 id="chatTitle">Chat</h3>
            <span id="msgCount" style="font-size: 12px;">Meseji: 5</span>
        </div>

        <div class="chat-messages" id="chatMessages">
            <!-- Meseji zitaingia hapa -->
        </div>

        <div id="inputArea" class="chat-input-area">
            <input type="text5" id="messageInput" placeholder="Andika ujumbe wako..." autocomplete="off">
            <button onclick="sendMessage()">Tuma</button>
        </div>

        <div id="lockedArea" class="locked-overlay" style="display: none;">
            Ujumbe wako wa bure umeisha! Tafadhali lipa TZS 2,000 kwa siku 5 ili uendelee kuchati.
            <br>
            <button onclick="paySubscription()">Lipa Sasa (TZS 2,000)</button>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const urlParams = new URLSearchParams(window.location.search);
        const receiverId = urlParams.get('id');
        const receiverName = urlParams.get('name');

        if (!currentUser || !receiverId) {
            window.location.href = 'discover.html';
        }

        document.getElementById('chatTitle').innerText = receiverName || 'Mazungumzo';

        async function loadMessages() {
            try {
                const res = await fetch(`/api/chat/${currentUser.id}/${receiverId}`);
                const data = await res.json();

                const container = document.getElementById('chatMessages');
                container.innerHTML = '';

                data.messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `message ${m.senderId == currentUser.id ? 'sent' : 'received'}`;
                    div.innerText = m.text;
                    container.appendChild(div);
                });

                container.scrollTop = container.scrollHeight;
                document.getElementById('msgCount').innerText = `Zilizobaki: ${data.freeMessagesLeft}`;

                if (!data.isAllowed) {
                    document.getElementById('inputArea').style.display = 'none';
                    document.getElementById('lockedArea').style.display = 'block';
                } else {
                    document.getElementById('inputArea').style.display = 'flex';
                    document.getElementById('lockedArea').style.display = 'none';
                }
            } catch (err) {
                console.error("Hitilafu ya kupakia ujumbe:", err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            try {
                const res = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        senderId: currentUser.id,
                        receiverId: receiverId,
                        text: text
                    })
                });
                const data = await res.json();

                if (res.ok) {
                    input.value = '';
                    currentUser.freeMessagesLeft = data.freeMessagesLeft;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    loadMessages();
                } else {
                    alert(data.error);
                    if (data.locked) {
                        document.getElementById('inputArea').style.display = 'none';
                        document.getElementById('lockedArea').style.display = 'block';
                    }
                }
            } catch (err) {
                alert("Imeshindikana kutuma ujumbe.");
            }
        }

        async function paySubscription() {
            if (!confirm("Je, ungependa kulipa TZS 2,000 ili uwe na siku 5 za kuchati bila kikomo?")) return;

            try {
                const res = await fetch(`/api/subscribe/${currentUser.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser.subscriptionExpiresAt = data.expiresAt;
                    currentUser.freeMessagesLeft = 0;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    alert(data.message);
                    loadMessages();
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert("Hitilafu ya malipo imetokea.");
            }
        }

        setInterval(loadMessages, 3000); // Kufanya refresh ya ujumbe kila baada ya sekunde 3
        loadMessages();
    </script>
</body>
</html>
