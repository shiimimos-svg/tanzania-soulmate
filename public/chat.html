<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazungumzo - Tanzania Soul Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f4; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        @media(min-width: 481px) { .container { min-height: 85vh; border-radius: 20px; overflow: hidden; } }

        /* Chat Header */
        .chat-header { padding: 15px 20px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 15px; position: sticky; top: 0; z-index: 10; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .chat-header-info h3 { font-size: 16px; font-weight: 600; color: #111; }
        .chat-header-info p { font-size: 11px; color: #666; }
        .back-btn { font-size: 18px; color: #555; cursor: pointer; text-decoration: none; }

        /* Messages Area */
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; padding-bottom: 80px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4; position: relative; word-break: break-word; }
        .message.sent { background: #ff3366; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.received { background: #fff; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #eee; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; }

        /* Chat Input Area */
        .chat-input-area { position: absolute; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; padding: 12px 15px; display: flex; align-items: center; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; outline: none; }
        .chat-input-area button { background: #ff3366; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }

        /* Paywall Modal */
        .paywall-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .paywall-content { background: white; padding: 30px; border-radius: 16px; text-align: center; width: 100%; max-width: 350px; }
        .paywall-content h3 { color: #ff3366; margin-bottom: 10px; font-size: 20px; }
        .paywall-content p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
        .btn-pay { background: #2e7d32; color: white; width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <div class="chat-header">
        <a href="discover.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <img id="receiverPhoto" src="https://via.placeholder.com/150" alt="Avatar">
        <div class="chat-header-info">
            <h3 id="receiverName">Inapakia...</h3>
            <p id="chatStatus">Ujumbe wa bure uliosalia: <span id="freeCount">5</span></p>
        </div>
    </div>

    <!-- Messages Container -->
    <div class="chat-messages" id="messagesContainer">
        <!-- Sehemu ya Ujumbe -->
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="Andika ujumbe wako..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <!-- Paywall Modal -->
    <div id="paywallModal" class="paywall-modal">
        <div class="paywall-content">
            <h3>Ujumbe Wako Umeisha!</h3>
            <p>Ujumbe wako wa bure umeisha. Lipa <b>TZS 2,000</b> kupitia M-Pesa/TigoPesa kwenda namba <b>0760000000</b> kisha bonyeza kitufe hapa chini kuendelea kuchati kwa siku 5 mfululizo.</p>
            <button class="btn-pay" onclick="simulatePayment()">Thibitisha Malipo (TZS 2,000)</button>
        </div>
    </div>

</div>

<script>
    let currentUser = null;
    let receiverId = null;
    let receiverUser = null;

    window.onload = async function() {
        const userStr = localStorage.getItem('soulmateUser');
        if (!userStr) {
            window.location.href = 'index.html';
            return;
        }
        currentUser = JSON.parse(userStr);

        const urlParams = new URLSearchParams(window.location.search);
        receiverId = urlParams.get('receiverId');

        if (!receiverId) {
            window.location.href = 'discover.html';
            return;
        }

        await fetchReceiverInfo();
        await loadMessages();

        // Endelea kukagua ujumbe mpya kila baada ya sekunde 3
        setInterval(loadMessages, 3000);
    };

    async function fetchReceiverInfo() {
        try {
            const res = await fetch(`/api/admin/users`);
            const users = await res.json();
            receiverUser = users.find(u => u.id.toString() === receiverId);

            if (receiverUser) {
                document.getElementById('receiverName').innerText = receiverUser.fullName;
                document.getElementById('receiverPhoto').src = receiverUser.photoData || 'https://via.placeholder.com/150';
            }
        } catch (err) {
            console.error("Imeshindikana kupata taarifa za mpokeaji.");
        }
    }

    async function loadMessages() {
        try {
            const res = await fetch(`/api/chat/${currentUser.id}/${receiverId}`);
            const data = await res.json();

            if (res.ok) {
                document.getElementById('freeCount').innerText = data.freeMessagesLeft;
                
                const container = document.getElementById('messagesContainer');
                container.innerHTML = "";

                if (data.messages.length === 0) {
                    container.innerHTML = `<p style="text-align: center; color: #888; font-size: 12px; margin-top: 20px;">Anza mazungumzo na ${receiverUser ? receiverUser.fullName : 'huyu mtu'} leo!</p>`;
                    return;
                }

                data.messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `message ${msg.senderId === currentUser.id.toString() ? 'sent' : 'received'}`;
                    div.innerText = msg.text;
                    container.appendChild(div);
                });

                container.scrollTop = container.scrollHeight;
            }
        } catch (err) {
            console.error("Hitilafu wakati wa kupakia ujumbe.");
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();

        if (!text) return;

        try {
            const res = await fetch('/api/chat/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    senderId: currentUser.id,
                    receiverId: receiverId,
                    text: text
                })
            });

            const data = await res.json();

            if (res.status === 403 && data.locked) {
                document.getElementById('paywallModal').style.display = 'flex';
                return;
            }

            if (res.ok) {
                input.value = "";
                loadMessages();
            } else {
                alert(data.error || "Imeshindikana kutuma ujumbe.");
            }
        } catch (err) {
            alert("Hitilafu ya mtandao.");
        }
    }

    async function simulatePayment() {
        try {
            const res = await fetch(`/api/subscribe/${currentUser.id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await res.json();

            if (res.ok) {
                alert(data.message);
                document.getElementById('paywallModal').style.display = 'none';
                loadMessages();
            } else {
                alert(data.error);
            }
        } catch (err) {
            alert("Hitilafu wakati wa kulipia.");
        }
    }
</script>

</body>
</html>
