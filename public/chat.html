<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Chati na Mwenza</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff0f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; box-sizing: border-box; }
        .chat-container { width: 100%; max-width: 500px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 85vh; overflow: hidden; }
        .chat-header { background: #d81b60; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .message { padding: 10px 14px; border-radius: 10px; max-width: 75%; font-size: 14px; word-break: break-word; }
        .message.sent { background: #d81b60; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.received { background: #e0e0e0; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: center; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #d81b60; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .whatsapp-box { background: #d4edda; color: #155724; padding: 12px; text-align: center; font-weight: bold; display: none; font-size: 14px; border-top: 1px solid #c3e6cb; }
        .pay-btn { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 10px; font-size: 12px; }
        .back-btn { background: none; border: none; color: white; cursor: pointer; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <button class="back-btn" onclick="window.location.href='discover.html'">⬅ Rudi</button>
        <span id="chatTitle">Mazungumzo ❤️</span>
        <span id="msgCount" style="font-size: 12px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 4px;">Meseji: 5</span>
    </div>

    <div class="chat-messages" id="messagesBox">
        <!-- Meseji zitaletwa hapa -->
    </div>

    <div id="whatsappReveal" class="whatsapp-box">
        Namba ya WhatsApp: <span id="waNumber">07XXXXXXXX</span>
    </div>

    <div class="chat-input-area" id="inputArea">
        <input type="text" id="messageInput" placeholder="Andika ujumbe wako hapa...">
        <button onclick="sendMessage()">Tuma 🚀</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const receiverId = urlParams.get('id');
    const senderId = localStorage.getItem('userId');

    if (!senderId) {
        alert('Tafadhali jisajili kwanza!');
        window.location.href = 'index.html';
    }

    async function loadChat() {
        try {
            const res = await fetch(`/api/chat/messages/${senderId}/${receiverId}`);
            const messages = await res.json();
            
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            messages.forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.senderId == senderId ? 'sent' : 'received'}`;
                div.innerText = m.messageText;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        } catch (err) {
            console.error('Hitilafu ya kupakia meseji:', err);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        try {
            const res = await fetch('/api/chat/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senderId, receiverId, messageText: text })
            });
            const data = await res.json();

            if (res.ok) {
                input.value = '';
                document.getElementById('msgCount').innerText = `Meseji: ${data.freeMessagesLeft}`;
                loadChat();

                if (data.isPaid) {
                    revealWhatsApp(data.whatsappNumber);
                }
            } else if (data.requiresPayment) {
                alert(data.error);
                triggerPaymentPrompt();
            } else {
                alert(data.error || 'Imeshindwa kutuma.');
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function triggerPaymentPrompt() {
        if (confirm("Meseji zako za bure zimeisha! Je, unataka kulipia ili kufungua namba ya WhatsApp ya mshirika huyu?")) {
            const res = await fetch('/api/pay', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: senderId })
            });
            const data = await res.json();
            if (data.success) {
                alert(data.message);
                revealWhatsApp(data.whatsappNumber);
            }
        }
    }

    function revealWhatsApp(number) {
        document.getElementById('waNumber').innerText = number;
        document.getElementById('whatsappReveal').style.display = 'block';
    }

    setInterval(loadChat, 3000); // Kuangalia ujumbe mpya kila baada ya sekunde 3
    loadChat();
</script>

</body>
</html>
