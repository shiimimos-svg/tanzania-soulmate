<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff0f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #d81b60; text-align: center; margin-bottom: 25px; }
        .user-card { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 15px 0; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #d81b60; }
        .details h3 { margin: 0 0 5px; color: #333; font-size: 16px; }
        .details p { margin: 0; color: #666; font-size: 14px; }
        .back-link { display: inline-block; margin-top: 20px; color: #d81b60; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Dashibodi ya Admin - TanzaniaSoulMate ❤️</h2>
    <div id="adminUsersList">
        <!-- Orodha ya watumiaji italetwa hapa na JavaScript -->
    </div>
    <a href="index.html" class="back-link">⬅ Rudi kwenye ukurasa wa mwanzo</a>
</div>

<script>
    async function loadAdminUsers() {
        try {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            
            const listDiv = document.getElementById('adminUsersList');
            listDiv.innerHTML = '';

            if (users.length === 0) {
                listDiv.innerHTML = '<p style="text-align: center; color: #666;">Hakuna watumiaji waliojisajili bado.</p>';
                return;
            }

            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div class="user-info">
                        <img src="${user.photoUrl}" alt="${user.fullName}">
                        <div class="details">
                            <h3>${user.fullName}</h3>
                            <p>WhatsApp: ${user.whatsappNumber}</p>
                        </div>
                    </div>
                    <span style="color: green; font-weight: bold; font-size: 14px;">Iko Hewani 🟢</span>
                `;
                listDiv.appendChild(card);
            });
        } catch (err) {
            console.error('Imeshindwa kupakia orodha ya admin:', err);
        }
    }

    loadAdminUsers();
</script>

</body>
</html>
