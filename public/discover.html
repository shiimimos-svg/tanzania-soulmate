<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watumiaji - TanzaniaSoulMate</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            color: #d63384;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 15px;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card h3 {
            margin: 10px 0 5px;
            color: #333;
        }
        .card p {
            color: #666;
            font-size: 14px;
            margin: 0 0 15px;
        }
        .card button {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .card button:hover {
            background: #1ebe5d;
        }
        .no-users {
            text-align: center;
            color: #777;
            margin-top: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Watumiaji Halisi Waliopo Hewani ❤️</h2>
        <div class="grid" id="userGrid">
            <!-- Watumiaji wataingizwa hapa kupitia JavaScript -->
        </div>
        <div id="noUsersMessage" class="no-users" style="display: none;">
            Hakuna watumiaji waliothibitishwa kwa sasa. Tafadhali subiri au jisajili!
        </div>
    </div>

    <script>
        async function loadDiscoverUsers() {
            try {
                const response = await fetch('/api/users/discover');
                const users = await response.json();
                
                const grid = document.getElementById('userGrid');
                const noUsersMsg = document.getElementById('noUsersMessage');
                grid.innerHTML = '';

                if (users.length === 0) {
                    noUsersMsg.style.display = 'block';
                    return;
                }

                noUsersMsg.style.display = 'none';

                users.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${user.photoUrl}" alt="${user.fullName}">
                        <h3>${user.fullName}</h3>
                        <p>Mwanachama Halisi</p>
                        <button onclick="connectWhatsApp('${user.whatsappNumber}', '${user.fullName}')">Unganisha WhatsApp</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Hitilafu ya kupata watumiaji:", err);
            }
        }

        function connectWhatsApp(number, name) {
            const url = `https://wa.me/${number}?text=Habari%20${name},%20nimekuona%20kupitia%20TanzaniaSoulMate!`;
            window.open(url, '_blank');
        }

        loadDiscoverUsers();
    </script>
</body>
</html>
