<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watumiaji - TanzaniaSoulMate</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h2 {
            color: #d63384;
            margin: 0;
        }
        .user-info {
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding-bottom: 15px;
        }
        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .card h3 {
            margin: 10px 0 5px;
            color: #333;
        }
        .seeking-badge {
            display: inline-block;
            background: #fff0f3;
            color: #d63384;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .card button {
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .card button:hover {
            background: #b0266b;
        }
        .no-users {
            text-align: center;
            color: #777;
            margin-top: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h2>TanzaniaSoulMate ❤️</h2>
            <div id="userStatus" class="user-info">Inapakia taarifa zako...</div>
            <div class="btn-group">
                <button class="action-btn" onclick="paySubscription()">Lipa TZS 2,000 (Siku 5)</button>
                <button class="logout-btn" onclick="handleLogout()">Toka (Log Out)</button>
            </div>
        </div>

        <div class="grid" id="userGrid"></div>
        <div id="noUsersMessage" class="no-users" style="display: none;">
            Hakuna watumiaji waliyojiunga kwa sasa.
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        if (!currentUser) {
            window.location.href = 'index.html';
        }

        function updateStatusDisplay() {
            const statusDiv = document.getElementById('userStatus');
            const now = new Date();
            const hasActiveSub = currentUser.subscriptionExpiresAt && new Date(currentUser.subscriptionExpiresAt) > now;

            if (hasActiveSub) {
                statusDiv.innerHTML = `Akaunti Yako: <span style="color: green;">VIP (Siku 5)</span>`;
            } else {
                statusDiv.innerHTML = `Ujumbe wa Bure Uliobakia: <span style="color: #d63384; font-weight: bold;">${currentUser.freeMessagesLeft} / 5</span>`;
            }
        }

        async function loadDiscoverUsers() {
            try {
                const response = await fetch('/api/users/discover');
                const users = await response.json();
                
                const grid = document.getElementById('userGrid');
                const noUsersMsg = document.getElementById('noUsersMessage');
                grid.innerHTML = '';

                const otherUsers = users.filter(u => u.id !== currentUser.id);

                if (otherUsers.length === 0) {
                    noUsersMsg.style.display = 'block';
                    return;
                }

                noUsersMsg.style.display = 'none';

                otherUsers.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${user.photoUrl}" alt="${user.fullName}">
                        <h3>${user.fullName}</h3>
                        <div class="seeking-badge">Anatafuta: ${user.seeking || 'Mchumba'}</div>
                        <br>
                        <button onclick="startChat(${user.id}, '${user.fullName}')">Anzisha Mazungumzo</button>
                    `;
                    grid.appendChild(card);
                });

                updateStatusDisplay();
            } catch (err) {
                console.error("Hitilafu ya kupata watumiaji:", err);
            }
        }

        function startChat(targetId, targetName) {
            window.location.href = `chat.html?id=${targetId}&name=${encodeURIComponent(targetName)}`;
        }

        async function paySubscription() {
            if (!confirm("Je, ungependa kulipa TZS 2,000 ili uwe na siku 5 za kuchati na kuona ujumbe wote?")) return;

            try {
                const res = await fetch(`/api/subscribe/${currentUser.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser.subscriptionExpiresAt = data.expiresAt;
                    currentUser.freeMessagesLeft = 0;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    alert(data.message);
                    updateStatusDisplay();
                } else {
                    alert(data.error);
                }
            } catch (err) {
                alert("Hitilafu ya malipo imetokea.");
            }
        }

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        loadDiscoverUsers();
    </script>
</body>
</html>
