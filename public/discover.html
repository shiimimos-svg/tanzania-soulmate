<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gundua Wenza - TanzaniaSoulMate</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d63384;
            margin: 0;
            font-size: 22px;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }
        .container h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .user-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-info h3 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .user-info p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <script>
        // Kuzuia mtu kuingia kama hajalog in
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            alert('Tafadhali ingia kwenye akaunti yako kwanza!');
            window.location.href = 'login.html';
        }
    </script>

    <header>
        <h1>TanzaniaSoulMate ❤️</h1>
        <button class="logout-btn" onclick="logoutUser()">Log Out</button>
    </header>

    <div class="container">
        <h2>Watu Waliopo Kwenye Mfumo</h2>
        <div id="usersList">Inapakia taarifa...</div>
    </div>

    <script>
        function logoutUser() {
            localStorage.removeItem('currentUser');
            alert('Umeshalog out kwa mafanikio!');
            window.location.href = 'login.html';
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/users/discover');
                const users = await res.json();
                const container = document.getElementById('usersList');
                
                if (users.length === 0) {
                    container.innerHTML = '<p>Hakuna watumiaji waliopatikana kwa sasa.</p>';
                    return;
                }

                container.innerHTML = users.map(u => `
                    <div class="user-card">
                        <img src="${u.photoUrl}" alt="${u.fullName}">
                        <div class="user-info">
                            <h3>${u.fullName}</h3>
                            <p>Anachokitafuta: ${u.lookingFor}</p>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('usersList').innerHTML = '<p>Hitilafu ya kupata data za watumiaji.</p>';
            }
        }

        loadUsers();
    </script>
</body>
</html>
