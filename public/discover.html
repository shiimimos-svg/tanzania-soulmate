<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Tafuta Mwenza</title>
    <style>
        :root {
            --primary-pink: #ff4b72;
            --secondary-red: #d81b60;
            --soft-bg: #fff0f3;
            --text-dark: #333333;
            --white: #ffffff;
            --gold: #d4af37;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--soft-bg);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: var(--secondary-red);
            font-size: 28px;
        }

        p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.1);
            text-align: center;
            border: 1px solid #ffccd5;
        }

        .card img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid var(--gold);
        }

        .card h3 {
            margin: 10px 0 5px 0;
            color: var(--secondary-red);
        }

        .btn-like {
            background: linear-gradient(135deg, var(--primary-pink), var(--secondary-red));
            color: var(--white);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }

        .btn-like:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>TanzaniaSoulMate ❤️</h2>
        <p class="subtitle">Watu waliothibitishwa na wako tayari kukutana na wewe</p>

        <div id="profilesGrid" class="grid">
            <p style="text-align: center; grid-column: 1 / -1;">Inapakia profile za wenzako...</p>
        </div>
    </div>

    <script>
        async function loadProfiles() {
            try {
                const response = await fetch('/api/users/discover');
                const users = await response.json();
                const grid = document.getElementById('profilesGrid');

                if (users.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">Hakuna profile zilizoidhinishwa bado. Subiri Admin azi-approve!</p>';
                    return;
                }

                grid.innerHTML = '';
                users.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${user.photoUrl}" alt="Picha ya Profile">
                        <h3>${user.fullName}</h3>
                        <button class="btn-like" onclick="sendLike(${user.id}, '${user.whatsappNumber}', '${user.fullName}')">Tuma Like & Chat WhatsApp</button>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.log("Hitilafu imetokea kupata data.");
            }
        }

        async function sendLike(userId, whatsapp, name) {
            try {
                const res = await fetch(`/api/like/${userId}`, { method: 'POST' });
                const data = await res.json();
                
                if(res.ok) {
                    alert(`${data.message}\n\nUnahamishiwa WhatsApp kwenda kuchati na ${name}...`);
                    // Kufungua WhatsApp moja kwa moja kwenye simu/kompyuta
                    window.open(`https://wa.me/255${whatsapp.replace(/^0/, '')}?text=Habari%20${name},%20nimekuona%20TanzaniaSoulMate!`, '_blank');
                } else {
                    alert(data.error);
                }
            } catch(e) {
                alert("Imeshindikana kutuma like.");
            }
        }

        loadProfiles();
    </script>
</body>
</html>
