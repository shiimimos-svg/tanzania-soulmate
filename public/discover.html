<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Gundua Wenza</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff0f5; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; text-align: center; }
        h2 { color: #d81b60; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding: 20px 0; }
        .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #d81b60; margin-bottom: 10px; }
        .card h3 { margin: 10px 0 5px; color: #333; font-size: 18px; }
        .btn-whatsapp { background-color: #25D366; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 10px; font-size: 14px; }
        .btn-whatsapp:hover { background-color: #1ebe5d; }
        .back-link { display: inline-block; margin-top: 20px; color: #d81b60; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Watu Waliopo Hewani ❤️</h2>
    <p>Chagua mtu sahihi kisha bonyeza kitufe cha WhatsApp kuwasiliana naye moja kwa moja!</p>
    
    <div id="usersGrid" class="grid">
        <!-- Orodha ya watumiaji italetwa hapa moja kwa moja na JavaScript -->
    </div>

    <a href="index.html" class="back-link">⬅ Rudi kwenye ukurasa wa kujisajili</a>
</div>

<script>
    async function loadDiscoverUsers() {
        try {
            const res = await fetch('/api/users/discover');
            const users = await res.json();
            
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = '';

            if (users.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; color: #666;">Hakuna wenza bado kwa sasa. Jisajili uwe wa kwanza!</p>';
                return;
            }

            users.forEach(user => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${user.photoUrl}" alt="${user.fullName}">
                    <h3>${user.fullName}</h3>
                    <a href="https://wa.me/255${user.whatsappNumber.replace(/^0+/, '')}" target="_blank" class="btn-whatsapp">
                        Chati WhatsApp 💬
                    </a>
                `;
                grid.appendChild(card);
            });
        } catch (err) {
            console.error('Imeshindwa kupakia wenza:', err);
        }
    }

    loadDiscoverUsers();
</script>

</body>
</html>
