<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gundua - Tanzania Soul Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f4; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        @media(min-width: 481px) { .container { min-height: 85vh; border-radius: 20px; overflow: hidden; } }

        /* Header */
        .header { padding: 15px 20px; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .header h2 { font-size: 18px; color: #ff3366; font-weight: 700; }
        .header-icons { display: flex; gap: 12px; align-items: center; }
        
        .notification-icon-wrapper { position: relative; cursor: pointer; color: #555; font-size: 16px; display: inline-flex; align-items: center; gap: 6px; background: #fff0f3; padding: 5px 10px; border-radius: 20px; border: 1px solid #ffccd5; }
        .notification-icon-wrapper:hover { background: #ffe3e8; }
        
        .unread-text { font-size: 10px; font-weight: 600; color: #ff3366; display: none; white-space: nowrap; }
        .logout-btn { cursor: pointer; color: #555; font-size: 16px; padding: 5px; }
        .logout-btn:hover { color: #ff3366; }

        /* Filters Bar */
        .filters-bar { padding: 10px 15px; background: #fafafa; border-bottom: 1px solid #eee; display: flex; gap: 8px; overflow-x: auto; }
        .filter-select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 15px; font-size: 11px; background: #fff; outline: none; cursor: pointer; }

        /* Feed Content - Grid ya Profaili Ndogo Ndogo */
        .content { padding: 12px; flex: 1; overflow-y: auto; padding-bottom: 80px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        
        .profile-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eee; display: flex; flex-direction: column; justify-content: space-between; }
        
        .profile-img-container { width: 100%; height: 140px; position: relative; background: #eee; }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .profile-badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.6); color: white; padding: 2px 8px; border-radius: 10px; font-size: 9px; backdrop-filter: blur(4px); }
        
        .profile-info { padding: 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .profile-info h3 { font-size: 13px; font-weight: 600; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .profile-meta { font-size: 10px; color: #555; display: flex; align-items: center; gap: 4px; }
        .profile-meta i { color: #ff3366; font-size: 10px; }

        .profile-bio { font-size: 10px; color: #666; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }

        .btn-chat { width: 100%; padding: 7px; background: linear-gradient(135deg, #ff3366, #ff6b8b); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: auto; }

        /* Bottom Nav */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 10px 0; z-index: 10; }
        .nav-item { text-align: center; color: #888; font-size: 11px; text-decoration: none; cursor: pointer; position: relative; }
        .nav-item i { display: block; font-size: 16px; margin-bottom: 2px; }
        .nav-item.active { color: #ff3366; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <div class="header">
        <h2>Tanzania Soul Mate</h2>
        <div class="header-icons">
            <div class="notification-icon-wrapper" onclick="window.location.href='chats.html'" title="Arifa na Ujumbe">
                <i class="fa-solid fa-bell" style="color: #ff3366;"></i>
                <span id="unreadText" class="unread-text">Unread: 0</span>
            </div>
            <i class="fa-solid fa-right-from-bracket logout-btn" onclick="logout()" title="Ondoka"></i>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <select id="filterRegion" class="filter-select" onchange="loadUsers()">
            <option value="All">Mikoa Yote</option>
            <option value="Dar es Salaam">Dar es Salaam</option>
            <option value="Morogoro">Morogoro</option>
            <option value="Arusha">Arusha</option>
            <option value="Mwanza">Mwanza</option>
            <option value="Dodoma">Dodoma</option>
        </select>
        <select id="filterSeeking" class="filter-select" onchange="loadUsers()">
            <option value="All">Mahusiano Yote</option>
            <option value="Mchumba wa Ndoa">Mchumba wa Ndoa</option>
            <option value="Urafiki wa Kawaida">Urafiki wa Kawaida</option>
            <option value="Mahusiano ya Kina">Mahusiano ya Kina</option>
        </select>
    </div>

    <!-- Main Feed - Grid view ya picha ndogo -->
    <div class="content" id="profilesContainer">
        <p style="text-align: center; color: #888; grid-column: span 2; margin-top: 40px;">Inapakia wachumba...</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="showPage('discover')">
            <i class="fa-solid fa-fire"></i> Gundua
        </a>
        <a class="nav-item" onclick="window.location.href='chats.html'">
            <i class="fa-solid fa-comments"></i> Ujumbe
        </a>
        <a class="nav-item" onclick="window.location.href='profile.html'">
            <i class="fa-solid fa-user"></i> Profaili Yangu
        </a>
    </div>

</div>

<script>
    let currentUser = null;

    window.onload = function() {
        const userStr = localStorage.getItem('soulmateUser');
        if (!userStr) {
            window.location.href = 'index.html';
            return;
        }
        currentUser = JSON.parse(userStr);
        loadUsers();
        checkUnreadMessages(); 
    };

    async function loadUsers() {
        const region = document.getElementById('filterRegion').value;
        const seeking = document.getElementById('filterSeeking').value;
        const container = document.getElementById('profilesContainer');

        try {
            let url = `/api/admin/users?region=${region}&seeking=${seeking}`;
            const res = await fetch(url);
            const users = await res.json();

            container.innerHTML = "";
            const filteredUsers = users.filter(u => u.whatsappNumber !== currentUser.whatsappNumber);

            if (filteredUsers.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; grid-column: span 2; margin-top: 40px;">Hakuna wachumba waliopatikana.</p>`;
                return;
            }

            filteredUsers.forEach(user => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.innerHTML = `
                    <div class="profile-img-container">
                        <span class="profile-badge">${user.seeking || 'Mchumba'}</span>
                        <img src="${user.photoData || 'https://via.placeholder.com/150'}" alt="${user.fullName}">
                    </div>
                    <div class="profile-info">
                        <h3>${user.fullName}, ${user.age || 25}</h3>
                        <div class="profile-meta">
                            <i class="fa-solid fa-location-dot"></i> <span>${user.region || 'Tanzania'}</span>
                        </div>
                        <p class="profile-bio">${user.bio || 'Mtu mzuri ninayependa mazungumzo.'}</p>
                        <button class="btn-chat" onclick="startChat('${user._id || user.id}')">
                            <i class="fa-solid fa-comment-dots"></i> Chat
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            container.innerHTML = `<p style="text-align: center; color: #c62828; grid-column: span 2; margin-top: 40px;">Imeshindikana kupata orodha.</p>`;
        }
    }

    async function checkUnreadMessages() {
        try {
            if (!currentUser) return;
            const identifier = currentUser.id || currentUser.whatsappNumber;
            if (!identifier) return;

            const res = await fetch(`/api/messages/unread-count?userId=${identifier}`);
            if (res.ok) {
                const data = await res.json();
                const unreadText = document.getElementById('unreadText');
                
                if (data.count > 0) {
                    unreadText.innerText = `Unread: ${data.count}`;
                    unreadText.style.display = 'inline-block';
                } else {
                    unreadText.style.display = 'none';
                }
            }
        } catch (err) {
            console.log("Imeshindikana kuangalia idadi ya ujumbe:", err);
        }
    }

    function startChat(receiverId) {
        window.location.href = `chat.html?receiverId=${receiverId}`;
    }

    function logout() {
        localStorage.removeItem('soulmateUser');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
