<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gundua - Tanzania Soul Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f4; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        @media(min-width: 481px) { .container { min-height: 85vh; border-radius: 20px; overflow: hidden; } }

        /* Header */
        .header { padding: 20px; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .header h2 { font-size: 20px; color: #ff3366; font-weight: 700; }
        .header-icons { display: flex; gap: 18px; align-items: center; }
        
        /* Icon ya Kengele yenye Badge ya Ujumbe */
        .notification-icon-wrapper { position: relative; cursor: pointer; color: #555; font-size: 18px; display: inline-flex; align-items: center; }
        .notification-icon-wrapper:hover { color: #ff3366; }
        .unread-badge { position: absolute; top: -5px; right: -6px; width: 10px; height: 10px; background-color: #ff3366; border-radius: 50%; border: 2px solid #fff; display: none; }

        .logout-btn { cursor: pointer; color: #555; font-size: 18px; }
        .logout-btn:hover { color: #ff3366; }

        /* Filters Bar */
        .filters-bar { padding: 15px 20px; background: #fafafa; border-bottom: 1px solid #eee; display: flex; gap: 10px; overflow-x: auto; }
        .filter-select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 12px; background: #fff; outline: none; cursor: pointer; }

        /* Feed Content */
        .content { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .profile-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        .profile-img-container { width: 100%; height: 320px; position: relative; background: #eee; }
        .profile-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .profile-badge { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; padding: 5px 12px; border-radius: 20px; font-size: 11px; backdrop-filter: blur(5px); }
        
        .profile-info { padding: 20px; }
        .profile-info h3 { font-size: 18px; font-weight: 600; margin-bottom: 5px; color: #111; }
        .profile-info p { font-size: 13px; color: #666; margin-bottom: 15px; line-height: 1.5; }
        
        .profile-meta { display: flex; gap: 15px; font-size: 12px; color: #555; margin-bottom: 15px; }
        .profile-meta span i { color: #ff3366; margin-right: 5px; }

        .btn-chat { width: 100%; padding: 12px; background: linear-gradient(135deg, #ff3366, #ff6b8b); color: white; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 10px rgba(255, 51, 102, 0.2); }

        /* Bottom Nav */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: #fff; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 12px 0; z-index: 10; }
        .nav-item { text-align: center; color: #888; font-size: 11px; text-decoration: none; cursor: pointer; position: relative; }
        .nav-item i { display: block; font-size: 18px; margin-bottom: 3px; }
        .nav-item.active { color: #ff3366; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <div class="header">
        <h2>Tanzania Soul Mate</h2>
        <div class="header-icons">
            <div class="notification-icon-wrapper" onclick="window.location.href='chats.html'" title="Arifa na Ujumbe">
                <i class="fa-solid fa-bell"></i>
                <span id="unreadBadge" class="unread-badge"></span>
            </div>
            <i class="fa-solid fa-right-from-bracket logout-btn" onclick="logout()" title="Ondoka"></i>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <select id="filterRegion" class="filter-select" onchange="loadUsers()">
            <option value="All">Mikoa Yote</option>
            <option value="Dar es Salaam">Dar es Salaam</option>
            <option value="Morogoro">Morogoro</option>
            <option value="Arusha">Arusha</option>
            <option value="Mwanza">Mwanza</option>
            <option value="Dodoma">Dodoma</option>
        </select>
        <select id="filterSeeking" class="filter-select" onchange="loadUsers()">
            <option value="All">Mahusiano Yote</option>
            <option value="Mchumba wa Ndoa">Mchumba wa Ndoa</option>
            <option value="Urafiki wa Kawaida">Urafiki wa Kawaida</option>
            <option value="Mahusiano ya Kina">Mahusiano ya Kina</option>
        </select>
    </div>

    <!-- Main Feed -->
    <div class="content" id="profilesContainer">
        <p style="text-align: center; color: #888; margin-top: 40px;">Inapakia wachumba...</p>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a class="nav-item active" onclick="showPage('discover')">
            <i class="fa-solid fa-fire"></i> Gundua
        </a>
        <a class="nav-item" onclick="window.location.href='chats.html'">
            <i class="fa-solid fa-comments"></i> Ujumbe
        </a>
        <a class="nav-item" onclick="window.location.href='profile.html'">
            <i class="fa-solid fa-user"></i> Profaili Yangu
        </a>
    </div>

</div>

<script>
    let currentUser = null;

    window.onload = function() {
        const userStr = localStorage.getItem('soulmateUser');
        if (!userStr) {
            window.location.href = 'index.html';
            return;
        }
        currentUser = JSON.parse(userStr);
        loadUsers();
        checkUnreadMessages(); // Inachunguza ujumbe mpya mara tu ukurasa unapofunguka
    };

    async function loadUsers() {
        const region = document.getElementById('filterRegion').value;
        const seeking = document.getElementById('filterSeeking').value;
        const container = document.getElementById('profilesContainer');

        try {
            let url = `/api/admin/users?region=${region}&seeking=${seeking}`;
            const res = await fetch(url);
            const users = await res.json();

            container.innerHTML = "";

            // Chuja ili mtumiaji asijionyeshe mwenyewe kwenye orodha
            const filteredUsers = users.filter(u => u.whatsappNumber !== currentUser.whatsappNumber);

            if (filteredUsers.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #888; margin-top: 40px;">Hakuna wachumba waliopatikana kwa uchaguzi huu.</p>`;
                return;
            }

            filteredUsers.forEach(user => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.innerHTML = `
                    <div class="profile-img-container">
                        <span class="profile-badge">${user.seeking || 'Mchumba'}</span>
                        <img src="${user.photoData || 'https://via.placeholder.com/150'}" alt="${user.fullName}">
                    </div>
                    <div class="profile-info">
                        <h3>${user.fullName}, ${user.age || 25}</h3>
                        <div class="profile-meta">
                            <span><i class="fa-solid fa-location-dot"></i> ${user.region || 'Tanzania'}</span>
                        </div>
                        <p>${user.bio || 'Mtu mzuri ninayependa mazungumzo ya maana.'}</p>
                        <button class="btn-chat" onclick="startChat('${user._id || user.id}')">
                            <i class="fa-solid fa-comment-dots"></i> Anza Kuchati
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        } catch (err) {
            container.innerHTML = `<p style="text-align: center; color: #c62828; margin-top: 40px;">Imeshindikana kupata orodha ya watu.</p>`;
        }
    }

    // Function ya kuangalia kama kuna ujumbe ambao haujasomwa kutoka kwenye Backend
    async function checkUnreadMessages() {
        try {
            if (!currentUser || (!currentUser._id && !currentUser.id)) return;
            const userId = currentUser._id || currentUser.id;

            const res = await fetch(`/api/messages/unread-count?userId=${userId}`);
            if (res.ok) {
                const data = await res.json();
                const badge = document.getElementById('unreadBadge');
                
                // Ikiwa kuna ujumbe mpya, kitone chekundu kitatokea juu ya kengele
                if (data.hasUnread) {
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            }
        } catch (err) {
            console.log("Imeshindikana kuangalia ujumbe mpya:", err);
        }
    }

    function startChat(receiverId) {
        window.location.href = `chat.html?receiverId=${receiverId}`;
    }

    function logout() {
        localStorage.removeItem('soulmateUser');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
