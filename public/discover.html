<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Discover</title>
    <style>
        :root {
            --primary: #d63384;
            --primary-hover: #c02974;
            --text-dark: #111827;
            --text-muted: #4b5563;
            --bg-light: #fff0f3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #ffffff;
            border-bottom: 1px solid #f3f4f6;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .unread-badge {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .logout-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #ffffff;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            padding-bottom: 15px;
        }

        .user-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .user-card h3 {
            margin: 12px 0 5px 0;
            font-size: 18px;
        }

        .user-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 15px 0;
        }

        .chat-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-btn:hover {
            background: var(--primary-hover);
        }

        /* Unread Popup Modal */
        .unread-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .unread-box {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .unread-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .unread-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">❤️ Tanzania<span>SoulMate</span></a>
        <div class="user-info">
            <div id="unreadBadge" class="unread-badge" onclick="openUnreadModal()">💌 Meseji Mpya (0)</div>
            <span id="welcomeUser">Karibu</span>
            <button class="logout-btn" onclick="logout()">Toka (Log Out)</button>
        </div>
    </header>

    <div class="container">
        <h2>Chagua Kundi Unalolitaka ❤️</h2>
        
        <div class="filter-tabs">
            <button class="filter-btn active" onclick="filterUsers('Wote', this)">Wote</button>
            <button class="filter-btn" onclick="filterUsers('Mchumba wa Ndoa', this)">Mchumba wa Ndoa</button>
            <button class="filter-btn" onclick="filterUsers('Urafiki Tu', this)">Urafiki Tu</button>
            <button class="filter-btn" onclick="filterUsers('Mahusiano ya Kawaida', this)">Mahusiano ya Kawaida</button>
        </div>

        <div id="usersGrid" class="users-grid"></div>
    </div>

    <!-- Unread Messages Modal -->
    <div id="unreadModal" class="unread-modal">
        <div class="unread-box">
            <div class="chat-header">
                <span>Meseji Mpya Zilizotumwa Kwako</span>
                <button class="close-chat" onclick="closeUnreadModal()">&times;</button>
            </div>
            <div id="unreadList" class="unread-list"></div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeUser').innerText = `Karibu, ${currentUser.fullName}`;
        }

        let allUsers = [];
        let unreadDataList = [];

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                allUsers = await res.json();
                displayUsers(allUsers);
            } catch (err) {
                console.error("Imeshindikana kupakia watumiaji", err);
            }
        }

        function displayUsers(usersToDisplay) {
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = '';
            let filtered = usersToDisplay.filter(u => u.whatsappNumber !== currentUser.whatsappNumber);

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">Hakuna watumiaji waliopatikana kwenye kundi hili.</p>';
                return;
            }

            filtered.forEach(u => {
                const card = document.createElement('div');
                card.className = 'user-card';
                const userPhoto = u.photoData || 'https://via.placeholder.com/250';

                card.innerHTML = `
                    <img src="${userPhoto}" alt="Picha ya ${u.fullName}">
                    <h3>${u.fullName}</h3>
                    <p>Anatafuta: <b>${u.seeking || 'Urafiki Tu'}</b></p>
                    <button class="chat-btn" onclick="openChat('${u.id}', '${u.fullName}')">Anzisha Mazungumzo</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterUsers(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'Wote') {
                displayUsers(allUsers);
            } else {
                const filtered = allUsers.filter(u => u.seeking === category);
                displayUsers(filtered);
            }
        }

        async function checkUnreadMessages() {
            try {
                const res = await fetch(`/api/messages/unread?user=${currentUser.whatsappNumber}`);
                unreadDataList = await res.json();
                const badge = document.getElementById('unreadBadge');

                let totalUnread = unreadDataList.reduce((sum, item) => sum + item.count, 0);

                if (totalUnread > 0) {
                    badge.innerText = `💌 Meseji Mpya (${totalUnread})`;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (err) {
                console.error("Hitilafu ya kukagua unread", err);
            }
        }

        function openUnreadModal() {
            const listContainer = document.getElementById('unreadList');
            listContainer.innerHTML = '';

            if (unreadDataList.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#6b7280;">Hakuna ujumbe mpya.</p>';
            } else {
                unreadDataList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'unread-item';
                    div.innerHTML = `
                        <div>
                            <b>${item.senderName}</b><br>
                            <span style="font-size: 12px; color: #6b7280;">Ujumbe (${item.count}) haujasomwa</span>
                        </div>
                        <button class="chat-btn" style="padding: 6px 12px; font-size: 12px;" onclick="openChatFromUnread('${item.senderId}', '${item.senderName}')">Soma</button>
                    `;
                    listContainer.appendChild(div);
                });
            }
            document.getElementById('unreadModal').style.display = 'flex';
        }

        function closeUnreadModal() {
            document.getElementById('unreadModal').style.display = 'none';
        }

        function openChatFromUnread(senderId, name) {
            closeUnreadModal();
            openChat(senderId, name);
        }

        function openChat(receiverId, name) {
            window.location.href = `chat.html?id=${receiverId}&name=${encodeURIComponent(name)}`;
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        loadUsers();
        checkUnreadMessages();
        setInterval(checkUnreadMessages, 3000);
    </script>
</body>
</html>
