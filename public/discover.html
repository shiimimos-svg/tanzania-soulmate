<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Discover</title>
    <style>
        :root {
            --primary: #d63384;
            --primary-hover: #c02974;
            --text-dark: #111827;
            --text-muted: #4b5563;
            --bg-light: #fff0f3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #ffffff;
            border-bottom: 1px solid #f3f4f6;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .unread-badge {
            background: #ef4444;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .logout-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 15px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #ffffff;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            padding-bottom: 15px;
        }

        .user-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .user-card h3 {
            margin: 12px 0 5px 0;
            font-size: 18px;
        }

        .user-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 15px 0;
        }

        .chat-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-btn:hover {
            background: var(--primary-hover);
        }

        /* Unread Popup Modal */
        .unread-modal, .chat-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .unread-box, .chat-box {
            background: white;
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-box {
            height: 520px;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .unread-list {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .unread-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9fafb;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.incoming {
            background: #e5e7eb;
            color: var(--text-dark);
            align-self: flex-start;
        }

        .message.outgoing {
            background: var(--primary);
            color: white;
            align-self: flex-end;
        }

        .message img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 5px;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            padding: 10px;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
        }

        .file-upload-btn {
            background: #e5e7eb;
            color: var(--text-dark);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .chat-input-area button.send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">❤️ Tanzania<span>SoulMate</span></a>
        <div class="user-info">
            <div id="unreadBadge" class="unread-badge" onclick="openUnreadModal()">💌 Meseji Mpya (0)</div>
            <span id="welcomeUser">Karibu</span>
            <button class="logout-btn" onclick="logout()">Toka (Log Out)</button>
        </div>
    </header>

    <div class="container">
        <h2>Chagua Kundi Unalolitaka ❤️</h2>
        
        <div class="filter-tabs">
            <button class="filter-btn active" onclick="filterUsers('Wote', this)">Wote</button>
            <button class="filter-btn" onclick="filterUsers('Mchumba wa Ndoa', this)">Mchumba wa Ndoa</button>
            <button class="filter-btn" onclick="filterUsers('Urafiki Tu', this)">Urafiki Tu</button>
            <button class="filter-btn" onclick="filterUsers('Mahusiano ya Kawaida', this)">Mahusiano ya Kawaida</button>
        </div>

        <div id="usersGrid" class="users-grid"></div>
    </div>

    <!-- Unread Messages Modal -->
    <div id="unreadModal" class="unread-modal">
        <div class="unread-box">
            <div class="chat-header">
                <span>Meseji Mpya Zilizotumwa Kwako</span>
                <button class="close-chat" onclick="closeUnreadModal()">&times;</button>
            </div>
            <div id="unreadList" class="unread-list">
                <!-- Orodha ya waliotuma meseji itaonekana hapa -->
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="chat-modal">
        <div class="chat-box">
            <div class="chat-header">
                <span id="chatWithTitle">Mazungumzo</span>
                <button class="close-chat" onclick="closeChat()">&times;</button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <label for="imageInput" class="file-upload-btn" title="Ambata Picha">📷</label>
                <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(this)">
                
                <input type="text" id="messageInput" placeholder="Andika ujumbe wako..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">Tuma</button>
            </div>
            <div id="imagePreviewContainer" style="padding: 5px 10px; background: #eee; display: none; font-size: 12px; align-items: center; justify-content: space-between;">
                <span id="fileName">Picha imeteuliwa</span>
                <button onclick="clearImage()" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold;">Ondoa</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeUser').innerText = `Karibu, ${currentUser.fullName}`;
        }

        let allUsers = [];
        let activeChatUserPhone = null;
        let selectedImageBase64 = null;
        let unreadDataList = [];

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                allUsers = await res.json();
                displayUsers(allUsers);
            } catch (err) {
                console.error("Imeshindikana kupakia watumiaji", err);
            }
        }

        function displayUsers(usersToDisplay) {
            const grid = document.getElementById('usersGrid');
            grid.innerHTML = '';
            let filtered = usersToDisplay.filter(u => u.whatsappNumber !== currentUser.whatsappNumber);

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted);">Hakuna watumiaji waliopatikana kwenye kundi hili.</p>';
                return;
            }

            filtered.forEach(u => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <img src="${u.photoData || 'https://via.placeholder.com/250'}" alt="Picha">
                    <h3>${u.fullName}</h3>
                    <p>Anatafuta: <b>${u.seeking || 'Urafiki Tu'}</b></p>
                    <button class="chat-btn" onclick="openChat('${u.whatsappNumber}', '${u.fullName}')">Anzisha Mazungumzo</button>
                `;
                grid.appendChild(card);
            });
        }

        function filterUsers(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'Wote') {
                displayUsers(allUsers);
            } else {
                const filtered = allUsers.filter(u => u.seeking === category);
                displayUsers(filtered);
            }
        }

        async function checkUnreadMessages() {
            try {
                const res = await fetch(`/api/messages/unread?user=${currentUser.whatsappNumber}`);
                unreadDataList = await res.json();
                const badge = document.getElementById('unreadBadge');

                let totalUnread = unreadDataList.reduce((sum, item) => sum + item.count, 0);

                if (totalUnread > 0) {
                    badge.innerText = `💌 Meseji Mpya (${totalUnread})`;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            } catch (err) {
                console.error("Hitilafu ya kukagua unread", err);
            }
        }

        function openUnreadModal() {
            const listContainer = document.getElementById('unreadList');
            listContainer.innerHTML = '';

            if (unreadDataList.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#6b7280;">Hakuna ujumbe mpya.</p>';
            } else {
                unreadDataList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'unread-item';
                    div.innerHTML = `
                        <div>
                            <b>${item.senderName}</b><br>
                            <span style="font-size: 12px; color: #6b7280;">Ujumbe (${item.count}) haujasomwa</span>
                        </div>
                        <button class="chat-btn" style="padding: 6px 12px; font-size: 12px;" onclick="openChatFromUnread('${item.senderPhone}', '${item.senderName}')">Soma</button>
                    `;
                    listContainer.appendChild(div);
                });
            }
            document.getElementById('unreadModal').style.display = 'flex';
        }

        function closeUnreadModal() {
            document.getElementById('unreadModal').style.display = 'none';
        }

        function openChatFromUnread(phone, name) {
            closeUnreadModal();
            openChat(phone, name);
        }

        function openChat(phone, name) {
            activeChatUserPhone = phone;
            document.getElementById('chatWithTitle').innerText = `Chat na ${name}`;
            document.getElementById('chatModal').style.display = 'flex';
            loadMessages();
        }

        function closeChat() {
            document.getElementById('chatModal').style.display = 'none';
            activeChatUserPhone = null;
            clearImage();
            checkUnreadMessages();
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageBase64 = e.target.result;
                    document.getElementById('fileName').innerText = `Picha: ${input.files[0].name}`;
                    document.getElementById('imagePreviewContainer').style.display = 'flex';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearImage() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        async function loadMessages() {
            if (!activeChatUserPhone) return;
            try {
                const res = await fetch(`/api/messages?sender=${currentUser.whatsappNumber}&receiver=${activeChatUserPhone}`);
                const messages = await res.json();
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';

                messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `message ${m.sender === currentUser.whatsappNumber ? 'outgoing' : 'incoming'}`;
                    
                    let content = '';
                    if (m.text) content += `<div>${m.text}</div>`;
                    if (m.photoData) content += `<img src="${m.photoData}" alt="Picha">`;
                    div.innerHTML = content;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
                checkUnreadMessages();
            } catch (err) {
                console.error("Hitilafu ya kupata meseji", err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if ((!text && !selectedImageBase64) || !activeChatUserPhone) return;

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: currentUser.whatsappNumber,
                        receiver: activeChatUserPhone,
                        text: text,
                        photoData: selectedImageBase64
                    })
                });

                if (res.ok) {
                    input.value = '';
                    clearImage();
                    loadMessages();
                }
            } catch (err) {
                console.error("Hitilafu ya kutuma meseji", err);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        loadUsers();
        checkUnreadMessages();

        setInterval(() => {
            checkUnreadMessages();
            if (activeChatUserPhone) {
                loadMessages();
            }
        }, 3000);
    </script>
</body>
</html>
