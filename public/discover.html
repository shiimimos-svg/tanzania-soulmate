<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gundua Wenza - TanzaniaSoulMate</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #d63384;
            margin: 0;
            font-size: 22px;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }
        .container h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .user-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .user-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .user-card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-info h3 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .user-info p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .chat-btn {
            background: #d63384;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        .chat-btn:hover {
            background: #b8226c;
        }
    </style>
</head>
<body>
    <script>
        // Kuzuia mtu kuingia kama hajalog in
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            alert('Tafadhali ingia kwenye akaunti yako kwanza!');
            window.location.href = 'login.html';
        }
    </script>

    <header>
        <h1>TanzaniaSoulMate ❤️</h1>
        <button class="logout-btn" onclick="logoutUser()">Log Out</button>
    </header>

    <div class="container">
        <h2>Watu Waliopo Kwenye Mfumo (Bots & Members)</h2>
        <div id="usersList">Inapakia taarifa kutoka Database...</div>
    </div>

    <script>
        function logoutUser() {
            localStorage.removeItem('currentUser');
            alert('Umeshalog out kwa mafanikio!');
            window.location.href = 'login.html';
        }

        async function loadBots() {
            try {
                // Tunaita orodha ya bot 500 kutoka MongoDB kupitia server yetu
                const res = await fetch('/api/bots');
                const bots = await res.json();
                const container = document.getElementById('usersList');
                
                if (bots.length === 0) {
                    container.innerHTML = '<p>Hakuna bot zilizopatikana kwenye mfumo kwa sasa.</p>';
                    return;
                }

                container.innerHTML = bots.map(b => `
                    <div class="user-card">
                        <div class="user-left">
                            <img src="${b.profilePicture}" alt="${b.name}">
                            <div class="user-info">
                               <h3>${b.name}, ${b.age}</h3>
                               <p>${b.bio || 'Mtaalam wa kupiga stori na kujivinjari.'}</p>
                               <span style="font-size: 12px; color: #28a745; font-weight: bold;">🟢 Mtandaoni Sasa</span>
                            </div>
                        </div>
                        <a href="chat.html?botId=${b._id}" class="chat-btn">Anza Kuchati</a>
                    </div>
                `).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('usersList').innerHTML = '<p>Hitilafu ya kupata data za bot kwenye database.</p>';
            }
        }

        loadBots();
    </script>
</body>
</html>
