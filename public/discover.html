<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Discover</title>
    <style>
        :root {
            --primary: #d63384;
            --primary-hover: #c02974;
            --text-dark: #111827;
            --text-muted: #4b5563;
            --bg-light: #fff0f3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: #ffffff;
            border-bottom: 1px solid #f3f4f6;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo span {
            color: var(--primary);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .user-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            padding-bottom: 15px;
        }

        .user-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .user-card h3 {
            margin: 12px 0 5px 0;
            font-size: 18px;
        }

        .user-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 15px 0;
        }

        .chat-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .chat-btn:hover {
            background: var(--primary-hover);
        }

        /* Chat Modal */
        .chat-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .chat-box {
            background: white;
            width: 100%;
            max-width: 450px;
            height: 500px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .close-chat {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9fafb;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.incoming {
            background: #e5e7eb;
            color: var(--text-dark);
            align-self: flex-start;
        }

        .message.outgoing {
            background: var(--primary);
            color: white;
            align-self: flex-end;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
        }

        .chat-input-area button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 16px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">❤️ Tanzania<span>SoulMate</span></a>
        <div class="user-info">
            <span id="welcomeUser">Karibu</span>
            <button class="logout-btn" onclick="logout()">Toka (Log Out)</button>
        </div>
    </header>

    <div class="container">
        <h2>Watu Waliopo Karibu Yako ❤️</h2>
        <div id="usersGrid" class="users-grid">
            <!-- Watumiaji watajazwa hapa -->
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chatModal" class="chat-modal">
        <div class="chat-box">
            <div class="chat-header">
                <span id="chatWithTitle">Mazungumzo</span>
                <button class="close-chat" onclick="closeChat()">&times;</button>
            </div>
            <div id="chatMessages" class="chat-messages">
                <!-- Meseji zitaonekana hapa -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Andika ujumbe wako..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Tuma</button>
            </div>
        </div>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('welcomeUser').innerText = `Karibu, ${currentUser.fullName}`;
        }

        let activeChatUserPhone = null;

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const grid = document.getElementById('usersGrid');
                grid.innerHTML = '';

                users.forEach(u => {
                    if (u.whatsappNumber !== currentUser.whatsappNumber) {
                        const card = document.createElement('div');
                        card.className = 'user-card';
                        card.innerHTML = `
                            <img src="${u.photoData || 'https://via.placeholder.com/250'}" alt="Picha">
                            <h3>${u.fullName}</h3>
                            <p>Anatafuta: ${u.seeking || 'Urafiki'}</p>
                            <button class="chat-btn" onclick="openChat('${u.whatsappNumber}', '${u.fullName}')">Anzisha Mazungumzo</button>
                        `;
                        grid.appendChild(card);
                    }
                });
            } catch (err) {
                console.error("Imeshindikana kupakia watumiaji", err);
            }
        }

        function openChat(phone, name) {
            activeChatUserPhone = phone;
            document.getElementById('chatWithTitle').innerText = `Chat na ${name}`;
            document.getElementById('chatModal').style.display = 'flex';
            loadMessages();
        }

        function closeChat() {
            document.getElementById('chatModal').style.display = 'none';
            activeChatUserPhone = null;
        }

        async function loadMessages() {
            if (!activeChatUserPhone) return;
            try {
                const res = await fetch(`/api/messages?sender=${currentUser.whatsappNumber}&receiver=${activeChatUserPhone}`);
                const messages = await res.json();
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';

                messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `message ${m.sender === currentUser.whatsappNumber ? 'outgoing' : 'incoming'}`;
                    div.innerText = m.text;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } catch (err) {
                console.error("Hitilafu ya kupata meseji", err);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeChatUserPhone) return;

            try {
                const res = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sender: currentUser.whatsappNumber,
                        receiver: activeChatUserPhone,
                        text: text
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    input.value = '';
                    loadMessages();
                } else {
                    alert(data.error || "Imeshindikana kutuma ujumbe.");
                }
            } catch (err) {
                console.error("Hitilafu ya kutuma meseji", err);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        loadUsers();

        // Kurefresh meseji kila baada ya sekunde 3 ili kuona mpya zikitumwa
        setInterval(() => {
            if (activeChatUserPhone) {
                loadMessages();
            }
        }, 3000);
    </script>
</body>
</html>
