<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profaili Yangu - Tanzania Soul Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f4; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; position: relative; }
        @media(min-width: 481px) { .container { min-height: 85vh; border-radius: 20px; overflow: hidden; } }

        /* Header */
        .profile-header { padding: 20px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
        .profile-header h2 { font-size: 18px; font-weight: 600; color: #ff3366; }
        .back-btn { font-size: 18px; color: #555; cursor: pointer; text-decoration: none; }

        /* Profile Content */
        .profile-body { flex: 1; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; background: #fafafa; overflow-y: auto; }
        .profile-avatar-container { position: relative; width: 110px; height: 110px; margin-bottom: 20px; }
        .profile-avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #ff3366; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        .profile-info-card { width: 100%; background: #fff; padding: 20px; border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 20px; border: 1px solid #eee; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f2f2f2; font-size: 13px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #777; font-weight: 500; }
        .info-value { color: #111; font-weight: 600; text-align: right; }

        /* Status Badge */
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .status-free { background: #fff3cd; color: #856404; }
        .status-premium { background: #d4edda; color: #155724; }

        /* Actions */
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-logout { background: #fff; color: #ff3366; border: 1px solid #ff3366; }
        .btn-logout:hover { background: #fff5f7; }

        /* Bottom Nav */
        .bottom-nav { display: flex; background: #fff; border-top: 1px solid #eee; padding: 10px 0; position: sticky; bottom: 0; width: 100%; }
        .nav-item { flex: 1; text-align: center; color: #888; font-size: 11px; text-decoration: none; display: flex; flex-direction: column; gap: 4px; }
        .nav-item i { font-size: 18px; }
        .nav-item.active { color: #ff3366; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Header -->
    <div class="profile-header">
        <a href="discover.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>Profaili Yangu</h2>
        <a href="discover.html" class="back-btn"><i class="fa-solid fa-compass"></i></a>
    </div>

    <!-- Body -->
    <div class="profile-body">
        <div class="profile-avatar-container">
            <img id="userPhoto" src="https://via.placeholder.com/150" alt="Picha ya Profaili">
        </div>

        <h3 id="userName" style="font-size: 18px; font-weight: 600; margin-bottom: 5px; color: #111;">Inapakia...</h3>
        <p id="userLocation" style="font-size: 12px; color: #666; margin-bottom: 25px;"><i class="fa-solid fa-location-dot"></i> Tanzania</p>

        <div class="profile-info-card">
            <div class="info-row">
                <span class="info-label">Jinsia:</span>
                <span class="info-value" id="userGender">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Mkoa:</span>
                <span class="info-value" id="userRegion">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Aina ya Uhusiano:</span>
                <span class="info-value" id="userLookingFor">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Hali ya Akaunti:</span>
                <span class="info-value"><span id="accountStatusBadge" class="status-badge status-free">Inapakia...</span></span>
            </div>
        </div>

        <button class="btn-action btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Ondoka kwenye Akaunti (Logout)</button>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <a href="discover.html" class="nav-item">
            <i class="fa-solid fa-fire"></i>
            <span>Gundua</span>
        </a>
        <a href="chats.html" class="nav-item">
            <i class="fa-solid fa-comments"></i>
            <span>Ujumbe</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profaili Yangu</span>
        </a>
    </div>

</div>

<script>
    window.onload = function() {
        const userStr = localStorage.getItem('soulmateUser');
        if (!userStr) {
            window.location.href = 'index.html';
            return;
        }
        
        const currentUser = JSON.parse(userStr);
        
        // Jaza taarifa kwenye ukurasa
        document.getElementById('userName').innerText = currentUser.fullName || 'Mtumiaji';
        document.getElementById('userLocation').innerText = `${currentUser.region || 'Tanzania'}`;
        document.getElementById('userGender').innerText = currentUser.gender || '-';
        document.getElementById('userRegion').innerText = currentUser.region || '-';
        document.getElementById('userLookingFor').innerText = currentUser.lookingFor || '-';
        
        if (currentUser.photoData) {
            document.getElementById('userPhoto').src = currentUser.photoData;
        }

        // Kagua hali ya malipo / usajili
        const badge = document.getElementById('accountStatusBadge');
        if (currentUser.isSubscribed) {
            badge.className = "status-badge status-premium";
            badge.innerText = "Premium (Aktivu)";
        } else {
            badge.className = "status-badge status-free";
            badge.innerText = "Kiwango cha Bure (Free)";
        }
    };

    function logout() {
        localStorage.removeItem('soulmateUser');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
