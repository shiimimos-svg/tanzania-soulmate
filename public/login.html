<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - TanzaniaSoulMate</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #d63384;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #d63384;
        }
        button {
            background: #d63384;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background: #b8226c;
        }
        .footer-text {
            margin-top: 15px;
            font-size: 14px;
            color: #444;
        }
        .footer-text a {
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Ingia kwenye Akaunti ❤️</h2>
        <p class="subtitle">TanzaniaSoulMate</p>
        
        <form id="loginForm">
            <input type="text" id="whatsappNumber" placeholder="Weka Namba yako ya WhatsApp" required>
            <button type="submit">Log In</button>
        </form>
        
        <div class="footer-text">
            Huna akaunti? <a href="index.html">Jisajili hapa</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const whatsappNumber = document.getElementById('whatsappNumber').value.trim();

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ whatsappNumber })
                });
                const data = await response.json();

                if (response.ok) {
                    // Tunahifadhi taarifa za mtumiaji kwenye kivinjari
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    alert('Umeingia kwa mafanikio! Karibu tena.');
                    window.location.href = 'discover.html'; // Badilisha iende kwenye ukurasa wako mkuu wa ndani
                } else {
                    alert(data.error || 'Namba ya WhatsApp haijapatikana!');
                }
            } catch (err) {
                console.error(err);
                alert('Hitilafu ya mtandao. Jaribu tena.');
            }
        });
    </script>
</body>
</html>
