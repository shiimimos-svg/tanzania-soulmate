<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - TanzaniaSoulMate</title>
    <style>
        body {
            background: #fff0f3;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #d63384;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Mtindo wa kikundi cha namba ya simu chenye +255 ya kudumu */
        .phone-input-container {
            display: flex;
            align-items: center;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
        }
        .phone-input-container:focus-within {
            border-color: #d63384;
            box-shadow: 0 0 0 2px rgba(214, 51, 132, 0.1);
        }
        .country-code {
            background-color: #f8f9fa;
            color: #333;
            padding: 12px 10px;
            font-size: 16px;
            font-weight: bold;
            border-right: 1px solid #ccc;
            user-select: none;
        }
        .phone-input-container input {
            border: none;
            outline: none;
            padding: 12px;
            font-size: 16px;
            width: 100%;
        }
        button {
            background: #d63384;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background: #b8226c;
        }
        .footer-text {
            margin-top: 15px;
            font-size: 14px;
            color: #444;
        }
        .footer-text a {
            color: #d63384;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Ingia kwenye Akaunti ❤️</h2>
        <p class="subtitle">TanzaniaSoulMate - Tanzania Pekee</p>
        
        <form id="loginForm">
            <!-- Sehemu ya namba ya simu yenye +255 ya kudumu na kuanza na 0 -->
            <div class="phone-input-container">
                <span class="country-code">+255</span>
                <input type="text" id="whatsappNumber" placeholder="712345678 (Anza na 0 au 7)" maxlength="10" required>
            </div>
            <button type="submit">Log In</button>
        </form>
        
        <div class="footer-text">
            Huna akaunti? <a href="index.html">Jisajili hapa</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            let rawInput = document.getElementById('whatsappNumber').value.trim();

            // Kama mtumiaji alianza kuandika na 0 (mfano: 0712345678), iondoe hiyo 0 ya mwanzo
            if (rawInput.startsWith('0')) {
                rawInput = rawInput.substring(1);
            }

            // Unganisha na ile +255 ya kudumu ili ipate muundo kamili: +255712345678
            const whatsappNumber = '+255' + rawInput;

            // Uhakiki wa haraka kabla ya kutuma kwenye seva
            const tzPhoneRegex = /^\+255[67]\d{8}$/;
            if (!tzPhoneRegex.test(whatsappNumber)) {
                alert('Tafadhali ingiza namba sahihi ya simu ya Tanzania (mfano: 07xxxxxxxx au 06xxxxxxxx)!');
                return;
            }

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ whatsappNumber })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    alert('Umeingia kwa mafanikio! Karibu tena.');
                    window.location.href = 'discover.html';
                } else {
                    alert(data.error || 'Namba ya WhatsApp haijapatikana!');
                }
            } catch (err) {
                console.error(err);
                alert('Hitilafu ya mtandao. Jaribu tena.');
            }
        });
    </script>
</body>
</html>
</html>
