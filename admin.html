<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanzaniaSoulMate - Admin Panel</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fff0f3;
            margin: 0;
            padding: 20px;
            color: #111827;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            color: #d63384;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #e5e7eb;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #f9fafb;
        }
        img.user-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
        }
        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Orodha ya Watumiaji Wote - TanzaniaSoulMate ❤️</h2>
        <p style="text-align: center; color: #4b5563;">Watumiaji wanaonekana hapa moja kwa moja bila uhakiki wowote.</p>
        
        <table>
            <thead>
                <tr>
                    <th>Picha</th>
                    <th>Jina Kamili</th>
                    <th>WhatsApp</th>
                    <th>Anatafuta</th>
                    <th>Kitendo</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr><td colspan="5" style="text-align: center;">Inapakia...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchUsers() {
            try {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const tbody = document.getElementById('userTableBody');
                tbody.innerHTML = '';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Hakuna watumiaji waliyojisajili bado.</td></tr>';
                    return;
                }

                users.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><img src="${u.photoData || 'https://via.placeholder.com/50'}" class="user-img" alt="Picha"></td>
                        <td>${u.fullName}</td>
                        <td>${u.whatsappNumber}</td>
                        <td>${u.seeking || 'Urafiki Tu'}</td>
                        <td><button class="delete-btn" onclick="deleteUser('${u.whatsappNumber}')">Futa</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Imeshindikana kupakia", err);
            }
        }

        async function deleteUser(phone) {
            if (confirm("Una uhakika unataka kumfuta mtumiaji huyu?")) {
                // Kama unahitaji kuongeza route ya kufuta hapo mbeleni unaweza kuiweka, kwa sasa hii inaonyesha tu orodha.
                alert("Kazi imefanyika.");
                fetchUsers();
            }
        }

        fetchUsers();
    </script>
</body>
</html>
